[files]
extend-exclude = [
    "package-lock.json",
    "node_modules/**",
    "dist/**",
    ".gitnexus/**",
    ".claude/**",
    "Context/**",
    "AGENTS.md",
    "CLAUDE.md",
]

[default]
locale = "en"

[default.extend-words]
