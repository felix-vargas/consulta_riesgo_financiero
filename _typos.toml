comando = "comando"
comercial = "comercial"
componentes = "componentes"
decisiones = "decisiones"
dependencias = "dependencias"
excede = "excede"
historial = "historial"
posible = "posible"
previos = "previos"
requiere = "requiere"
rut = "rut"
ruts = "ruts"
serie = "serie"
tema = "tema"
