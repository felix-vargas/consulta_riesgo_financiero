services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: riesgo-financiero-backend
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-consulta-riesgo-financiero-secret-key-2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: riesgo-financiero-frontend
    ports:
      - '5173:8080'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
